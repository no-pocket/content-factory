services:
  api:
    image: content-factory-worker:latest
    command: ["python", "-m", "app.api"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      ENABLE_YOUTUBE_DOWNLOAD: ${ENABLE_YOUTUBE_DOWNLOAD:-false}
      YOUTUBE_MAX_DURATION: ${YOUTUBE_MAX_DURATION:-7200}
      YOUTUBE_MAX_BYTES: ${YOUTUBE_MAX_BYTES:-1500000000}
      CONTENT_FACTORY_API_BIND: 0.0.0.0
      CONTENT_FACTORY_API_TOKEN: ${CONTENT_FACTORY_API_TOKEN:-}
      CONTENT_FACTORY_HERMES_TOKEN: ${CONTENT_FACTORY_HERMES_TOKEN:-}
      CONTENT_FACTORY_HERMES_ACTOR_ID: ${CONTENT_FACTORY_HERMES_ACTOR_ID:-}
      CONTENT_FACTORY_PUBLIC_URL: ${CONTENT_FACTORY_PUBLIC_URL:-http://localhost:8501}
    volumes:
      - ./app:/app/app:ro
      - ./data:/data
    ports: ["127.0.0.1:8510:8510"]
    depends_on: [redis]
    restart: unless-stopped
