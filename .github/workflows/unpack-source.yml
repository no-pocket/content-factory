name: Unpack source snapshot
on:
  push:
    paths:
      - 'source/content-factory.tar.xz'
      - '.github/workflows/unpack-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract the source tree
        run: |
          tar -xJf source/content-factory.tar.xz -C .
          git add -A
          git reset -- source/content-factory.tar.xz
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "feat: unpack Content Factory v4 sources"
            git push origin HEAD:main
          fi
