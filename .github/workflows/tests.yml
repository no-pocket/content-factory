name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Remotion runtime
        run: |
          npm --prefix renderer ci --no-audit --no-fund
          cd renderer && npx remotion browser ensure
          echo "REMOTION_DIR=$GITHUB_WORKSPACE/renderer" >> "$GITHUB_ENV"
          echo "RENDER_PUBLIC_DIR=$GITHUB_WORKSPACE/renderer/public/jobs" >> "$GITHUB_ENV"
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt -r requirements.web.lock
      - name: Run unit and synthetic render tests
        run: python -m pytest -q
  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
