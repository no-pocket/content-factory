services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    restart: unless-stopped
  frontend:
    build: ./frontend
    image: content-factory-frontend:latest
    volumes: ["web_auth:/run/web-auth:ro"]
    ports: ["127.0.0.1:8501:80"]
    depends_on: [web-api]
    restart: unless-stopped
  web-api:
    build:
      context: .
      dockerfile: Dockerfile.web-api
    image: content-factory-web-api:latest
    environment:
      CONTENT_FACTORY_AUTO_REWORK: ${CONTENT_FACTORY_AUTO_REWORK:-true}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434
      FRAME_VISION_MODEL: ${FRAME_VISION_MODEL:-}
      FRAME_VISION_TIMEOUT: ${FRAME_VISION_TIMEOUT:-90}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      ASSETS_DIR: /data/assets
      ENABLE_YOUTUBE_DOWNLOAD: ${ENABLE_YOUTUBE_DOWNLOAD:-true}
      YOUTUBE_MAX_DURATION: ${YOUTUBE_MAX_DURATION:-7200}
      YOUTUBE_MAX_BYTES: ${YOUTUBE_MAX_BYTES:-1500000000}
      RENDER_FALLBACK_FFMPEG: ${RENDER_FALLBACK_FFMPEG:-true}
      CONTENT_FACTORY_WEB_TOKEN_FILE: /run/web-auth/token
      CONTENT_FACTORY_WEB_HOSTS: ${CONTENT_FACTORY_WEB_HOSTS:-localhost:8501,127.0.0.1:8501,workstation:8501,workstation.taild835d6.ts.net:8501,100.78.0.122:8501}
      CONTENT_FACTORY_META_ENABLED: ${CONTENT_FACTORY_META_ENABLED:-auto}
    volumes: ["./data:/data", "web_auth:/run/web-auth"]
    depends_on: [redis]
    restart: unless-stopped
  worker:
    build: .
    image: content-factory-worker:latest
    # Trust optional local root CAs before the worker contacts Hugging Face.
    command: ["sh", "-ec", "update-ca-certificates >/dev/null && exec python -m app.worker"]
    environment:
      CONTENT_FACTORY_AUTO_REWORK: ${CONTENT_FACTORY_AUTO_REWORK:-true}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      # HTTPX/Hugging Face uses this combined system + custom trust store.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-GTA VI, Rockstar Games, Vice City, Lucia, Jason, Leonida.}
      EDIT_DIRECTOR: ${EDIT_DIRECTOR:-ollama}
      RENDER_ENGINE: ${RENDER_ENGINE:-remotion}
      RENDER_FALLBACK_FFMPEG: ${RENDER_FALLBACK_FFMPEG:-true}
      RENDER_TIMEOUT: ${RENDER_TIMEOUT:-900}
      ASSETS_DIR: /data/assets
      CLIP_RANKER: ${CLIP_RANKER:-heuristic}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      OLLAMA_PROPOSAL_MAX_CHUNKS: ${OLLAMA_PROPOSAL_MAX_CHUNKS:-12}
      ENABLE_YOUTUBE_DOWNLOAD: ${ENABLE_YOUTUBE_DOWNLOAD:-true}
      YOUTUBE_MAX_DURATION: ${YOUTUBE_MAX_DURATION:-7200}
      YOUTUBE_MAX_BYTES: ${YOUTUBE_MAX_BYTES:-1500000000}
    volumes:
      - ./data:/data
      - hf_cache:/root/.cache/huggingface
      # Optional CA PEM certificate(s) exported from the trusted issuing authority.
      - ./certs:/usr/local/share/ca-certificates/content-factory:ro
    depends_on: [redis]
    restart: unless-stopped
  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    volumes: [ollama_models:/root/.ollama]
    restart: unless-stopped
volumes:
  ollama_models:
  redis_data:
  hf_cache:
  web_auth:
